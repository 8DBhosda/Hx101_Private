name: Daily IPO GMP Tracker

on:
  schedule:
    - cron: "30 3 * * *"   # 3:30 UTC = 9:00 AM IST, every day
    - cron: "30 12 * * *"   # 6:00 PM IST
  workflow_dispatch:        # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IPO tracker
        run: python script.py

      - name: Commit and push updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update IPO tracker $(date -u +%Y-%m-%d)"
          git push
